<section class="page-container">
  <div class="table-container">
    <div class="table-title-container">
      <h3 class="table-title">
        Assigned Doctors
        <span class="table-title-info" *ngIf="!loading"> ({{ doctors.length }} total)</span>
      </h3>
    </div>

    <div class="transition-all duration-500 ease-in-out">
      <p-table [value]="loading ? skeletonItems : doctors" dataKey="doctorId" [responsiveLayout]="'scroll'">
        <ng-template pTemplate="header">
          <tr>
            <th>Doctor Name</th>
            <th>Department</th>
            <th>Phone Number</th>
            <th style="width: 8rem">Status</th>
            <th style="width: 6rem">Action</th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-doctor>
          @if (loading) {
            <tr>
              <td><p-skeleton width="100%" height="1rem"></p-skeleton></td>
              <td><p-skeleton width="100%" height="1rem"></p-skeleton></td>
              <td><p-skeleton width="100%" height="1rem"></p-skeleton></td>
              <td><p-skeleton width="100%" height="1rem"></p-skeleton></td>
              <td><p-skeleton width="1.5rem" height="1rem"></p-skeleton></td>
            </tr>
          } @else {
            <tr>
              <td>{{ doctor.fullName }}</td>
              <td>{{ doctor.department || '-' }}</td>
              <td>{{ doctor.phone }}</td>
              <td>
                <span [class]="doctor.isActive ? 'text-green-600 font-medium' : 'text-red-500 font-medium'">
                  {{ doctor.isActive ? 'Active' : 'Inactive' }}
                </span>
              </td>
              <td>
                <button [routerLink]="['/assigned-doctors', doctor.doctorId]" class="text-primary" title="View details">
                  <i class="fa fa-eye"></i>
                </button>
              </td>
            </tr>
          }
        </ng-template>

        <ng-template pTemplate="emptymessage">
          <tr>
            <td [attr.colspan]="5" class="not-found">
              <div>
                <i class="fa fa-magnifying-glass-minus"></i>
                <p>No doctors assigned to you yet.</p>
              </div>
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>
</section>
