<section class="page-container">
  <div class="flex flex-wrap justify-between items-center gap-3 mb-4">
    <h3 class="table-title">
      Departments
      <span class="table-title-info" *ngIf="!loading"> ({{ departments.length }} total)</span>
    </h3>
    <button pButton (click)="openCreate()">
      <i class="fa fa-plus"></i>
      <span>Add Department</span>
    </button>
  </div>

  <div class="rounded-xl border border-surface-200 dark:border-surface-700 bg-surface-0 dark:bg-surface-900 shadow-sm overflow-hidden">
    <p-table [value]="departments" [loading]="loading" responsiveLayout="scroll">
      <ng-template pTemplate="header">
        <tr>
          <th>Name</th>
          <th>Status</th>
          <th style="width: 10rem">Actions</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-department>
        <tr>
          <td>{{ department.name }}</td>
          <td>
            <span [class]="department.isActive ? 'badge badge-enabled' : 'badge badge-disabled'">{{ department.isActive ? 'Active' : 'Inactive' }}</span>
          </td>
          <td>
            <button pButton size="small" severity="secondary" [outlined]="true" (click)="openEdit(department)" title="Edit">
              <i class="fa fa-edit"></i>
            </button>
            <button
              *ngIf="department.isActive"
              pButton
              size="small"
              severity="danger"
              [outlined]="true"
              class="ml-2"
              (click)="deactivate(department, $event)"
              title="Deactivate"
            >
              <i class="fa fa-ban"></i>
            </button>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="3" class="text-center text-muted-color py-4">No departments yet. Add your first one.</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</section>

<p-dialog [visible]="showDialog" (visibleChange)="showDialog = $event" [modal]="true" [header]="editingDepartment ? 'Edit Department' : 'Add Department'" [style]="{ width: '24rem' }">
  <form [formGroup]="form" (ngSubmit)="save()" novalidate>
    <div class="mb-3">
      <label class="block text-xs font-medium mb-1">Name <span class="text-red-600">*</span></label>
      <input type="text" pInputText class="w-full" formControlName="name" placeholder="e.g. General Medicine" />
      <div *ngIf="hasError('name')" class="text-xs text-red-600 mt-1">Name is required.</div>
    </div>

    <div *ngIf="editingDepartment">
      <label class="block text-xs font-medium mb-1">Status</label>
      <p-select
        [options]="[
          { label: 'Active', value: true },
          { label: 'Inactive', value: false },
        ]"
        formControlName="isActive"
        optionLabel="label"
        optionValue="value"
        styleClass="w-full"
      ></p-select>
    </div>

    <div class="flex justify-end gap-3 mt-5">
      <button type="button" pButton severity="secondary" (click)="closeDialog()">Cancel</button>
      <button type="submit" pButton [disabled]="editingDepartment && (form.invalid || form.pristine)">{{ editingDepartment ? 'Save Changes' : 'Add Department' }}</button>
    </div>
  </form>
</p-dialog>
