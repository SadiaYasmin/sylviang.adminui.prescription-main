<section class="page-container">
  <div *ngIf="loading" class="text-muted-color">Loading...</div>

  <div class="flex flex-col gap-4 max-w-4xl" *ngIf="!loading">
    <div class="prefs-card">
      <h3>Preferred Template</h3>
      <p class="empty" *ngIf="!templates.length">No enabled templates available — ask an Admin to enable one.</p>

      <div class="template-options-grid">
        <button
          type="button"
          class="template-option"
          *ngFor="let t of templates"
          [class.selected]="preferences?.preferredTemplateId === t.templateId"
          [disabled]="saving"
          (click)="selectTemplate(t.templateId)"
        >
          <div class="template-option-preview">
            <app-template-preview [config]="t.config" [type]="t.type" [hospitalSettings]="hospitalSettings" [language]="langCode(t.language)" [scale]="0.28"></app-template-preview>
          </div>
          <span class="template-option-name">{{ t.name }}</span>
          <i class="fa fa-circle-check template-option-check" *ngIf="preferences?.preferredTemplateId === t.templateId"></i>
        </button>
      </div>
    </div>
  </div>
</section>
