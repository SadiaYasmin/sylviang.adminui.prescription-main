<section class="page-container">
  <form [formGroup]="doctorForm" (ngSubmit)="onSubmit()" novalidate>
    <div class="rounded-xl border border-surface-200 dark:border-surface-700 bg-surface-0 dark:bg-surface-900 p-4 shadow-sm mb-4">
      <label class="block text-xs font-medium mb-2">Profile Photo</label>
      <div class="flex items-center gap-4">
        <div class="h-20 w-20 rounded-xl overflow-hidden bg-surface-100 dark:bg-surface-800 flex items-center justify-center">
          <img *ngIf="currentPhotoUrl" [src]="currentPhotoUrl" alt="Doctor profile" class="h-full w-full object-cover" />
          <i *ngIf="!currentPhotoUrl" class="fa fa-user-doctor text-2xl text-muted-color"></i>
        </div>
        <div class="flex flex-col gap-1.5">
          <label class="inline-flex w-fit cursor-pointer items-center gap-2 rounded-lg border border-surface-300 px-3 py-1.5 text-xs font-medium">
            <i class="fa fa-camera"></i>
            {{ currentPhotoUrl ? 'Change Photo' : 'Upload Photo' }}
            <input type="file" accept="image/*" class="hidden" (change)="onPhotoSelected($event)" [disabled]="photoBusy" />
          </label>
          <button *ngIf="currentPhotoUrl" type="button" (click)="removePhoto()" class="text-xs text-muted-color w-fit">
            <i class="fa fa-times"></i> Remove photo
          </button>
        </div>
      </div>
      <div *ngIf="photoError" class="text-xs text-red-600 mt-1">{{ photoError }}</div>
    </div>

    <div class="rounded-xl border border-surface-200 dark:border-surface-700 bg-surface-0 dark:bg-surface-900 p-4 shadow-sm grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div class="sm:col-span-2">
        <label class="block text-xs font-medium mb-1">Full Name <span class="text-red-600">*</span></label>
        <input type="text" pInputText class="w-full" formControlName="fullName" placeholder="Dr. Jane Doe" />
        <div *ngIf="hasError('fullName')" class="text-xs text-red-600 mt-1">Full name is required.</div>
      </div>

      <div>
        <label class="block text-xs font-medium mb-1">Email <span class="text-red-600">*</span></label>
        <input type="email" pInputText class="w-full" formControlName="email" placeholder="doctor@example.com" />
        <div *ngIf="hasError('email')" class="text-xs text-red-600 mt-1">A valid email is required — the account setup invite is sent there.</div>
      </div>

      <div>
        <label class="block text-xs font-medium mb-1">Phone <span class="text-red-600">*</span></label>
        <input type="text" pInputText class="w-full" formControlName="phone" maxlength="11" placeholder="e.g. 01712345678" />
        <div *ngIf="hasError('phone')" class="text-xs text-red-600 mt-1">Enter a valid Bangladesh mobile number (11 digits, starting with 013-019).</div>
      </div>

      <div>
        <label class="block text-xs font-medium mb-1">Department <span class="text-red-600">*</span></label>
        <p-select
          [options]="departmentOptions"
          formControlName="department"
          optionLabel="name"
          optionValue="name"
          styleClass="w-full"
          placeholder="Select department"
          [showClear]="true"
        ></p-select>
        <div *ngIf="hasError('department')" class="text-xs text-red-600 mt-1">Department is required.</div>
      </div>

      <div>
        <label class="block text-xs font-medium mb-1">Specialization</label>
        <input type="text" pInputText class="w-full" formControlName="specialization" placeholder="Internal Medicine" />
      </div>

      <div>
        <label class="block text-xs font-medium mb-1">Qualification</label>
        <input type="text" pInputText class="w-full" formControlName="qualification" placeholder="MBBS, FCPS (Medicine)" />
      </div>

      <div>
        <label class="block text-xs font-medium mb-1">BM&amp;DC Reg. No. <span class="text-red-600">*</span></label>
        <input type="text" pInputText class="w-full" formControlName="licenseNumber" />
        <div *ngIf="hasError('licenseNumber')" class="text-xs text-red-600 mt-1">BM&amp;DC Reg. No. is required.</div>
      </div>

      <div>
        <label class="block text-xs font-medium mb-1">Years of Experience</label>
        <p-inputnumber formControlName="experienceYears" [min]="0" styleClass="w-full"></p-inputnumber>
      </div>

      <div>
        <label class="block text-xs font-medium mb-1">Gender</label>
        <p-select [options]="genderOptions" formControlName="gender" optionLabel="label" optionValue="value" styleClass="w-full" placeholder="Select"></p-select>
      </div>

      <div>
        <label class="block text-xs font-medium mb-1">Joining Date</label>
        <p-datepicker formControlName="joiningDate" dateFormat="yy-mm-dd" styleClass="w-full"></p-datepicker>
      </div>

      <div *ngIf="isEditMode">
        <label class="block text-xs font-medium mb-1">Status</label>
        <p-select
          [options]="[
            { label: 'Active', value: true },
            { label: 'Inactive', value: false },
          ]"
          formControlName="isActive"
          optionLabel="label"
          optionValue="value"
          styleClass="w-full"
        ></p-select>
      </div>
    </div>

    <div class="flex justify-between gap-3 mt-6">
      <button *ngIf="isEditMode" type="button" pButton severity="danger" [outlined]="true" (click)="resendAccountInvite($event)">
        <i class="fa fa-envelope"></i>
        <span>Resend Account Setup Email</span>
      </button>
      <div class="flex justify-end gap-3 flex-1">
        <button type="button" pButton severity="secondary" [routerLink]="['/doctors/doctor-list']">Cancel</button>
        <button type="submit" pButton [disabled]="isEditMode && (doctorForm.invalid || doctorForm.pristine)">{{ isEditMode ? 'Save Changes' : 'Create Doctor' }}</button>
      </div>
    </div>
  </form>
</section>
