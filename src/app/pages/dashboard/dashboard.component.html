<section class="page-container">
  <div class="welcome-message">
    <div class="flex flex-col items-center justify-center gap-4 py-16">
      <div class="flex items-center justify-center w-20 h-20 rounded-full bg-primary/10">
        <i class="fa-solid fa-chart-line text-4xl text-primary"></i>
      </div>
      <h1 class="text-2xl font-bold text-dark dark:text-white">Welcome to Sylvia NG</h1>
      <p class="text-neutral dark:text-white/60 text-center max-w-md">Use the sidebar or the cards below to navigate.</p>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-4 w-full max-w-xl">
        <a
          *ngFor="let card of cards"
          [routerLink]="card.href"
          class="flex items-center gap-4 p-4 rounded-xl border border-borderLight dark:border-borderDark bg-light dark:bg-dark hover:border-primary hover:shadow-md transition-all duration-200 group cursor-pointer"
        >
          <div class="flex items-center justify-center w-12 h-12 rounded-lg bg-primary/10 group-hover:bg-primary/20 transition-colors">
            <i [class]="card.icon + ' text-xl text-primary'"></i>
          </div>
          <div>
            <p class="font-semibold text-dark dark:text-white">{{ card.title }}</p>
            <p class="text-sm text-neutral dark:text-white/50">{{ card.description }}</p>
          </div>
        </a>
      </div>
    </div>
  </div>
</section>
