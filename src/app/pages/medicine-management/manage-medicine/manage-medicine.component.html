<section class="page-container">
  <div *ngIf="loading" class="text-muted-color">Loading medicine...</div>

  <form *ngIf="!loading" [formGroup]="medicineForm" (ngSubmit)="onSubmit()" novalidate class="rounded-xl border border-surface-200 dark:border-surface-700 bg-surface-0 dark:bg-surface-900 p-4 shadow-sm max-w-xl">
    <h3 class="text-lg font-semibold mb-4">{{ isEditMode ? 'Edit Medicine' : 'Add Medicine' }}</h3>

    <div class="flex flex-col gap-4">
      <div>
        <label class="block text-xs font-medium mb-1">Brand Name <span class="text-red-600">*</span></label>
        <input type="text" pInputText class="w-full" formControlName="brandName" placeholder="e.g. Napa" />
        <small class="text-danger" *ngIf="hasError('brandName')">Brand name is required.</small>
      </div>

      <div>
        <label class="block text-xs font-medium mb-1">Generic Name</label>
        <input type="text" pInputText class="w-full" formControlName="genericName" placeholder="e.g. Paracetamol" />
      </div>

      <div>
        <label class="block text-xs font-medium mb-1">Strength</label>
        <input type="text" pInputText class="w-full" formControlName="strength" placeholder="e.g. 500mg" />
      </div>

      <div>
        <label class="block text-xs font-medium mb-1">Manufacturer</label>
        <input type="text" pInputText class="w-full" formControlName="manufacturer" />
      </div>

      <div>
        <label class="block text-xs font-medium mb-1">Dosage Form</label>
        <input type="text" pInputText class="w-full" formControlName="dosageForm" placeholder="e.g. Tablet" />
      </div>

      <div>
        <label class="block text-xs font-medium mb-1">Route</label>
        <input type="text" pInputText class="w-full" formControlName="route" placeholder="e.g. Oral" />
      </div>

      <div>
        <label class="block text-xs font-medium mb-1">Category</label>
        <input type="text" pInputText class="w-full" formControlName="category" placeholder="e.g. Analgesic" />
      </div>

      <div>
        <label class="block text-xs font-medium mb-1">Unit Price (BDT)</label>
        <input type="number" pInputText class="w-full" formControlName="unitPrice" step="0.01" min="0" />
      </div>

      <div class="flex items-center gap-2">
        <p-checkbox formControlName="dgdaRegistered" [binary]="true" inputId="dgdaRegistered"></p-checkbox>
        <label for="dgdaRegistered" class="text-xs font-medium">DGDA Registered</label>
      </div>
    </div>

    <div class="flex justify-end gap-3 mt-6">
      <button type="button" pButton severity="secondary" (click)="goBack()">Cancel</button>
      <button type="submit" pButton [loading]="saving" [disabled]="isEditMode && (medicineForm.invalid || medicineForm.pristine)">{{ isEditMode ? 'Save Changes' : 'Create Medicine' }}</button>
    </div>
  </form>
</section>
