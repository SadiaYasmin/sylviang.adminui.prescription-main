<ng-container *ngIf="editable; else readonlyView">
  <div class="chip-list-editable">
    <div class="chip-row" *ngFor="let item of items; let i = index">
      <span class="chip-text">{{ item }}</span>
      <button type="button" class="chip-remove" (click)="remove(i)" aria-label="Remove">&times;</button>
    </div>
    <input
      type="text"
      class="chip-input"
      [(ngModel)]="draft"
      [placeholder]="placeholder"
      (keydown.enter)="$event.preventDefault(); add()"
      (blur)="add()"
    />
  </div>
</ng-container>
<ng-template #readonlyView>
  <ng-container *ngIf="items.length; else emptyReadonly">
    <p class="placeholder-text" *ngFor="let item of items">{{ item }}</p>
  </ng-container>
  <ng-template #emptyReadonly>
    <p class="placeholder-text placeholder-empty">{{ emptyReadonlyText }}</p>
  </ng-template>
</ng-template>
