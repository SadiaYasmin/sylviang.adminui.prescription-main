<ng-container *ngIf="editable; else readonlyView">
  <div class="freetext-row">
    <textarea
      class="rx-freetext"
      [rows]="rows"
      [value]="textValue"
      [placeholder]="placeholder"
      [appBanglaPhoneticInput]="banglaMode"
      (focus)="onFocus()"
      (blur)="onBlur($any($event.target).value)"
    ></textarea>
  </div>
</ng-container>
<ng-template #readonlyView>
  <ng-container *ngIf="items.length; else emptyReadonly">
    <ul class="rx-list">
      <li *ngFor="let item of items">{{ item }}</li>
    </ul>
  </ng-container>
  <ng-template #emptyReadonly>
    <p class="placeholder-text placeholder-empty">{{ emptyReadonlyText }}</p>
  </ng-template>
</ng-template>
