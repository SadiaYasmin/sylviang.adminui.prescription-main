<div class="login-page">
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-card">
    <h2 class="login-title">PrescriptionMS</h2>
    <p class="login-subtitle">Sign in to continue</p>

    <div *ngIf="loginError" class="login-error">{{ loginError }}</div>

    <!-- Username -->
    <div>
      <p-floatlabel variant="in">
        <input
          pInputText
          inputId="username"
          formControlName="username"
          class="w-full"
          autocomplete="username"
          [class.ng-invalid]="hasError('username')"
          [class.ng-dirty]="hasError('username')"
          (blur)="f['username'].markAsTouched()"
        />
        <label for="username">Username</label>
      </p-floatlabel>
      <div *ngIf="hasError('username')" class="invalid">{{ getErrorMessage('username') }}</div>
    </div>

    <!-- Password -->
    <div>
      <p-floatlabel variant="in">
        <p-password
          inputId="password"
          formControlName="password"
          class="w-full"
          [toggleMask]="true"
          [feedback]="false"
          autocomplete="current-password"
          [inputStyleClass]="'w-full'"
          [class.ng-invalid]="hasError('password')"
          [class.ng-dirty]="hasError('password')"
          (onBlur)="f['password'].markAsTouched()"
        ></p-password>
        <label for="password">Password</label>
      </p-floatlabel>
      <div *ngIf="hasError('password')" class="invalid">{{ getErrorMessage('password') }}</div>
    </div>

    <button pButton type="submit" class="w-full login-submit" [disabled]="isSubmitting">
      <i class="fas fa-sign-in-alt" *ngIf="!isSubmitting"></i>
      <i class="fas fa-spinner fa-spin" *ngIf="isSubmitting"></i>
      <span>{{ isSubmitting ? 'Signing in...' : 'Sign In' }}</span>
    </button>
  </form>
</div>
